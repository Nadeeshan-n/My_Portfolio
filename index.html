    <!-- Shim window.fetch setter in environments where window.fetch is getter-only -->
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') ||
                     Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'fetch');
          if (desc && !desc.set && desc.configurable) {
            Object.defineProperty(window, 'fetch', {
              get: function() { return currentFetch; },
              set: function(fn) { currentFetch = fn; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {}

        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.includes('fetch') && event.message.includes('getter')) {
            event.preventDefault && event.preventDefault();
            return true;
          }
        });
      })();
    </script>
